[project]
name = "scopy-mcp-server"
version = "2.3.0"
description = "MCP server for controlling ADI Scopy instruments from AI assistants (requires a running Scopy)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [{name = "Analog Devices Inc."}]
keywords = ["scopy", "mcp", "ai", "analog-devices", "adi", "instruments", "sdr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Kept for backward compatibility; pywin32 is now installed automatically on Windows.
windows = ["pywin32>=306"]

[project.urls]
Homepage = "https://github.com/analogdevicesinc/scopy"
Repository = "https://github.com/analogdevicesinc/scopy"

[project.scripts]
scopy-mcp-server = "scopy_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scopy_mcp_server"]

[tool.hatch.build.targets.sdist]
include = ["scopy_mcp_server", "README.md", "pyproject.toml"]
