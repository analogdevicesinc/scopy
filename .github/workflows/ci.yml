name: Build & Test Qt6

on:
    push:
      paths-ignore:
        - 'docs/**'
        - '**.md'
        - '**.rst'
        - 'testing_results/**'
        - '.clang-format'
        - '.cmake-format'
        - '.gitignore'
        - '**/.gitignore'
        - '.github/workflows/license-header.yml'
        - '.github/workflows/generate_doc.yml'
        - '.github/workflows/clang-format.yml'

    pull_request:
      paths-ignore:
        - 'docs/**'
        - '**.md'
        - '**.rst'
        - 'testing_results/**'
        - '.clang-format'
        - '.cmake-format'
        - '.gitignore'
        - '**/.gitignore'
        - '.github/workflows/license-header.yml'
        - '.github/workflows/generate_doc.yml'
        - '.github/workflows/clang-format.yml'

    workflow_dispatch:
      inputs:
        docker_tag:
          # "latest" is deliberately absent: it exists on only one of the seven images, so
          # selecting it fails at docker pull. Add it back when the retag to :latest happens.
          description: 'Docker image tag ("auto" resolves from the branch name)'
          required: true
          default: 'auto'
          type: choice
          options:
            - auto
            - slim
            - testing

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read
  packages: write
  artifact-metadata: write
  checks: write
  actions: write
  id-token: write

jobs:
    # Always runs, for every trigger. A dispatch passes its choice through as an override rather
    # than skipping this job, which is what previously let a dispatch select a nonexistent :latest.
    docker_tag:
      uses: ./.github/workflows/get_docker_tag.yml
      with:
        override: ${{ inputs.docker_tag }}

    ubuntu-qt6-build:
      needs: docker_tag
      uses: ./.github/workflows/ubuntubuild.yml
      with:
        docker_tag: ${{ needs.docker_tag.outputs.docker_tag }}
      secrets:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}

    # DEPS REWORK: re-enabled. This is the only job that produces Ubuntu artifacts, and its
    # matrix covers scopy2-ubuntu{22,24,26}-qt6, so it is also the only CI coverage of 22.04
    # and 26.04 (ubuntubuild.yml deliberately tests 24.04 only). A working AppImage is the
    # real proof the slim dependency set is sufficient.
    appimage-x86_64-qt6:
      needs: docker_tag
      uses: ./.github/workflows/appimage-x86_64.yml
      with:
        docker_tag: ${{ needs.docker_tag.outputs.docker_tag }}
      secrets:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}

    mingw-qt6:
      needs: docker_tag
      uses: ./.github/workflows/mingwbuild.yml
      with:
        docker_tag: ${{ needs.docker_tag.outputs.docker_tag }}
      secrets:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}

    arm64-qt6:
      needs: docker_tag
      uses: ./.github/workflows/appimage-arm64.yml
      with:
        docker_tag: ${{ needs.docker_tag.outputs.docker_tag }}
      secrets:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}

    armhf-qt6:
      needs: docker_tag
      uses: ./.github/workflows/appimage-armhf.yml
      with:
        docker_tag: ${{ needs.docker_tag.outputs.docker_tag }}
      secrets:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}

    flatpak-qt6:
      needs: docker_tag
      uses: ./.github/workflows/linuxflatpakbuild.yml
      with:
        docker_tag: ${{ needs.docker_tag.outputs.docker_tag }}
      secrets:
        CLOUDSMITH_SERVICE_SLUG: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}

    macos-qt6:
      uses: ./.github/workflows/macosbuild.yml
