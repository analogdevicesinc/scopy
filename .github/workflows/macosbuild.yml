name: macOS Qt6 Scopy Build

on:
    workflow_call:

env:
  USERNAME: github-actions

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    name: ${{ matrix.platform.name }} (libiio v${{ matrix.libiio }})
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15
            name: macOS 15 Qt6 (ARM64)
            artifact: Scopy-macOS15-arm64-qt6
          - runner: macos-15-large
            name: macOS 15 Qt6 (Intel)
            artifact: Scopy-macOS15-x86_64-qt6
          - runner: macos-26
            name: macOS 26 Qt6 (ARM64)
            artifact: Scopy-macOS26-arm64-qt6
          - runner: macos-26-intel
            name: macOS 26 Qt6 (Intel)
            artifact: Scopy-macOS26-x86_64-qt6
        # libiio v1 is the default build; each job builds only the libiio it needs.
        libiio: ['1', '0']

    env:
      SCOPY_LIBIIO_VERSION: ${{ matrix.libiio }}

    steps:
        - uses: actions/checkout@v6
          with:
            fetch-depth: 0

        # Cache keys: ImageOS/ImageVersion change with each runner image, the deps key also tracks upstream commits
        - name: Compute cache keys
          id: keys
          run: |
            : "${ImageOS:?}" "${ImageVersion:?}"
            BREW_KEY="brew-${ImageOS}-${{ runner.arch }}-${ImageVersion}-${{ hashFiles('ci/macOS/install_macos_deps.sh') }}"
            DEPS_SHA=$(bash ci/macOS/deps_cache_key.sh)
            echo "brew=$BREW_KEY" >> "$GITHUB_OUTPUT"
            echo "deps=deps-libiio${SCOPY_LIBIIO_VERSION}-${BREW_KEY}-${{ hashFiles('ci/macOS/macos_config.sh') }}-${DEPS_SHA}" >> "$GITHUB_OUTPUT"

        - name: Restore Homebrew cache
          id: brew-cache
          uses: actions/cache/restore@v5
          with:
            path: ~/brew-kegs
            key: ${{ steps.keys.outputs.brew }}

        - name: Restore dependencies cache
          id: deps-cache
          uses: actions/cache/restore@v5
          with:
            path: staging/dependencies
            key: ${{ steps.keys.outputs.deps }}

        - name: Build and Install Dependencies
          env:
            BREW_CACHE_HIT: ${{ steps.brew-cache.outputs.cache-hit }}
            DEPS_CACHE_HIT: ${{ steps.deps-cache.outputs.cache-hit }}
          run: |
            chmod +x ci/macOS/macos_config.sh ci/macOS/install_macos_deps.sh ci/macOS/build_macos.sh ci/macOS/package_darwin.sh
            ./ci/macOS/install_macos_deps.sh

        - name: Save Homebrew cache
          if: steps.brew-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@v5
          with:
            path: ~/brew-kegs
            key: ${{ steps.keys.outputs.brew }}

        - name: Save dependencies cache
          if: steps.deps-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@v5
          with:
            path: staging/dependencies
            key: ${{ steps.keys.outputs.deps }}

        - name: Build Scopy
          run: |
            export MACOSX_DEPLOYMENT_TARGET=11.0
            ./ci/macOS/build_macos.sh

        - name: Create Scopy.dmg
          run: ./ci/macOS/package_darwin.sh

        - name: Set short git commit SHA
          run: echo "commit_sha=$(git rev-parse --short ${{ github.sha }})" >> "$GITHUB_ENV"

        - uses: actions/upload-artifact@v7
          if: always()
          with:
            name: ${{ matrix.platform.artifact }}${{ matrix.libiio == '0' && '-libiio-v0' || '' }}-${{ env.commit_sha }}
            path: |
              build/Scopy.dmg
              build/ScopyApp.zip
