name: Scopy arm64 Qt6 Build

on:
    workflow_call:
      inputs:
        docker_tag:
          required: true
          type: string
      secrets:
        CLOUDSMITH_SERVICE_SLUG:
          required: true

env:
  BUILD_HOST: ubuntu-22.04
  USERNAME: github-actions
  CI_SCRIPT: "ON"

jobs:
  make_arm64_qt6:
    runs-on: ubuntu-24.04-arm
    name: arm64 Qt6 AppImage (libiio v${{ matrix.libiio }})
    strategy:
      fail-fast: false
      matrix:
        # libiio v1 is the default build; v0 uses the libiio v0 prefix shipped in the same image.
        libiio: ['1', '0']
    env:
      APPIMAGE_NAME: Scopy-arm64${{ matrix.libiio == '0' && '-libiio-v0' || '' }}
    steps:

        - name: check storage space
          run: df -h
        - name: "Runner cleanup"
          run: |
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force
            sudo docker builder prune -a --force
        - run: df -h

        - uses: actions/checkout@v6
          with:
                set-safe-directory: 'true'
                fetch-depth: '0'

        - name: Generate Cloudsmith OIDC Token
          uses: cloudsmith-io/cloudsmith-cli-action@18665afcce9f859312b61989671af9af7402e4fb # v2.0.2
          with:
            oidc-namespace: 'adi'
            oidc-service-slug: ${{ secrets.CLOUDSMITH_SERVICE_SLUG }}
            oidc-auth-only: 'true'

        - name: Pull the Docker Image
          run: |
                docker login docker.cloudsmith.io -u token -p "$CLOUDSMITH_API_KEY"
                docker pull docker.cloudsmith.io/adi/scopy-dockers/scopy2-arm64-native-qt6:${{ inputs.docker_tag }}

        - name: Build Scopy AppImage
          shell: bash
          run: |
                docker run \
                        -e SCOPY_LIBIIO_VERSION=${{ matrix.libiio }} \
                        --mount type=bind,source="$GITHUB_WORKSPACE",target=/home/runner/scopy \
                        docker.cloudsmith.io/adi/scopy-dockers/scopy2-arm64-native-qt6:${{ inputs.docker_tag }} \
                        /bin/bash -c    'cd $HOME && \
                                        sudo chown -R runner:runner scopy && \
                                        cd $HOME/scopy && \
                                        sudo apt-get update && sudo apt-get install -y squashfs-tools patchelf && \
                                        ./ci/arm/arm_native_build_process.sh download_cmake generate_appimage
                                        '
        - name: Extract Scopy version
          id: version
          run: |
            ver=$(grep -oP 'project\(scopy VERSION \K[0-9.]+' CMakeLists.txt)
            phase=$(grep -oP 'set\(SCOPY_RELEASE_PHASE \K[^)]+' CMakeLists.txt | tr -d '"' | sed 's/^-/~/' || true)
            printf 'version=%s%s\n' "$ver" "$phase" >> "$GITHUB_OUTPUT"

        - name: Checkout shared-actions for build-deb.sh
          uses: actions/checkout@v6
          with:
            repository: analogdevicesinc/shared-actions
            ref: 9efc4d656aced2e6cba05ff76c24eea54c9e3688
            path: shared-actions

        - name: Generate .deb package
          id: deb
          run: |
            IGNORE_PATH=$(printf '%s\n' '${{ env.APPIMAGE_NAME }}.AppImage' 'shared-actions' 'build*' 'ci/arm/staging')
            docker run --rm \
              -e VERSION=${{ steps.version.outputs.version }} \
              -e WORKING_DIRECTORY=/scopy \
              -e CONTROL_PATH=ci/packaging/debian \
              -e IGNORE_PATH="$IGNORE_PATH" \
              -e GITHUB_WORKSPACE=/scopy \
              -e DEB_APPIMAGE_PATH=/scopy/${{ env.APPIMAGE_NAME }}.AppImage \
              -v "$GITHUB_WORKSPACE:/scopy" \
              -v "$GITHUB_WORKSPACE/shared-actions:/shared-actions:ro" \
              arm64v8/debian:bookworm \
              bash -c "apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && bash /shared-actions/deb-generator-action/build-deb.sh"
            echo "artifact-dir=$GITHUB_WORKSPACE/artifacts" >> "$GITHUB_OUTPUT"

        - name: Upload deb package
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          with:
            name: scopy-deb-arm64${{ matrix.libiio == '0' && '-libiio-v0' || '' }}
            path: ${{ steps.deb.outputs.artifact-dir }}/*.deb
        - name: Set short git commit SHA
          shell: bash
          run: echo "commit_sha=$(git rev-parse --short ${{ github.sha }})" >> "$GITHUB_ENV"

        - uses: actions/upload-artifact@v7
          with:
            # Must match move_appimage in ci/arm/arm_native_build_process.sh
            name: scopy-arm64-qt6-appimage${{ matrix.libiio == '0' && '-libiio-v0' || '' }}-${{ env.commit_sha }}
            path: ${{ github.workspace }}/${{ env.APPIMAGE_NAME }}.AppImage

        - name: check storage space
          run: df -h
