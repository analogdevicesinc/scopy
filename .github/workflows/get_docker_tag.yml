name: Get Docker Tag

on:
  workflow_call:
    outputs:
      docker_tag:
        value: ${{ jobs.get_docker_tag.outputs.docker_tag }}

permissions:
  contents: read

jobs:
   get_docker_tag:
    name: Get Docker Tag
    runs-on: ubuntu-latest
    outputs:
        docker_tag: ${{ steps.set_docker_tag.outputs.docker_tag }}
    steps:
      - name: Get branch name
        id: set_docker_tag
        run: |
          # if a branch contains "scopy-testing" in its name, use "testing" tag, otherwise use "latest"

          echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
          echo "GITHUB_HEAD_REF: $GITHUB_HEAD_REF"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH_NAME="$GITHUB_HEAD_REF"
            else
            BRANCH_NAME="$GITHUB_REF_NAME"
          fi

          case "$BRANCH_NAME" in
            *deps_rework*)
                # Dependency rework: this branch builds against the slim images. A platform's
                # job in ci.yml stays disabled until its own image carries a :slim tag, or it
                # would fail at docker pull. Enabled so far: ubuntu{22,24,26}, windows, arm64.
                # Remove this case once slim is promoted to :testing / :latest.
                TAG="slim"
                ;;
            *scopy-testing*|*scopy_qt6*|qt6_*)
                TAG="testing"
                ;;
            *)
                # TODO: revert to "latest" after the docker dependencies cleanup and docker regeneration
                TAG="testing"
                ;;
           esac

           echo "Selected tag: $TAG"
           echo "docker_tag=$TAG" >> $GITHUB_OUTPUT
