name: Get Docker Tag

on:
  workflow_call:
    inputs:
      override:
        description: 'Explicit tag. Empty or "auto" resolves from the branch name.'
        required: false
        type: string
        default: ''
    outputs:
      docker_tag:
        value: ${{ jobs.get_docker_tag.outputs.docker_tag }}

permissions:
  contents: read

jobs:
   get_docker_tag:
    name: Get Docker Tag
    runs-on: ubuntu-latest
    outputs:
        docker_tag: ${{ steps.set_docker_tag.outputs.docker_tag }}
    steps:
      - name: Get branch name
        id: set_docker_tag
        env:
          OVERRIDE: ${{ inputs.override }}
        run: |
          # Tag policy - the single source of truth for every job in ci.yml.
          #
          #   :slim    - the reduced dependency set. What main and every ordinary branch build
          #              against TODAY. This is an interim state agreed deliberately: :slim will
          #              later be retagged to :latest and the default here flipped, at which point
          #              :slim retires. Until that happens :slim IS the production tag.
          #   :testing - staging. Where a freshly built image lands to be validated, and what ci_*
          #              branches build against, so work ON the images cannot break main.
          #   :latest  - NOT IN USE YET. Present on only 1 of the 7 images (scopy-windows-qt6, and
          #              there it holds pre-slim content), so selecting it fails at docker pull for
          #              the other six. Deliberately not offered until the retag happens.
          #
          # A branch opts into :testing with the ci_ prefix CLAUDE.md documents - the prefix for work
          # on the images and workflows themselves. Everything else, main and ordinary dev_/exp_
          # feature branches included, gets whatever main gets.
          #
          # The resolver always runs, so a workflow_dispatch cannot bypass this policy - it passes
          # its choice in as `override` instead. It previously defaulted to "latest" while skipping
          # this job entirely, which selected a tag six of the seven images do not have.
          #
          # Deliberately NOT implemented: falling back to another tag when the chosen one is missing.
          # That would silently build against different content and mask a failed promotion.

          echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
          echo "GITHUB_HEAD_REF: $GITHUB_HEAD_REF"
          echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH_NAME="$GITHUB_HEAD_REF"
            else
            BRANCH_NAME="$GITHUB_REF_NAME"
          fi

          echo "override: ${OVERRIDE:-(none)}"

          if [[ -n "$OVERRIDE" && "$OVERRIDE" != "auto" ]]; then
            TAG="$OVERRIDE"
            echo "Tag overridden by workflow_dispatch input"
          else
            case "$BRANCH_NAME" in
              ci_*|*scopy-testing*|*scopy_qt6*|qt6_*)
                  TAG="testing"
                  ;;
              *)
                  # Step 2 of the agreed migration flips this to "latest" once :slim has been
                  # retagged for all seven images. One line, and :slim retires.
                  TAG="slim"
                  ;;
            esac
          fi

          echo "Selected tag: $TAG"
          echo "docker_tag=$TAG" >> $GITHUB_OUTPUT
